name: ci

on:
  push:
    branches: [main, v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Unit, acceptance, conformance and PTY suite
        run: ruby test/run.rb
      - name: Warning check
        run: |
          warnings="$(mktemp)"
          trap 'rm -f "$warnings"' EXIT
          status=0
          ruby -w test/run.rb 2>"$warnings" || status=$?
          cat "$warnings" >&2
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -q 'warning:' "$warnings"; then exit 1; fi

  test-arm64:
    name: Ruby 3.4 arm64 (best effort)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Unit, acceptance, conformance and PTY suite
        run: ruby test/run.rb

  soak:
    name: soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Repeated process and PTY soak
        run: ruby bench/soak.rb
