name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-guard:
    name: Version guard
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          manifest="$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' rust/Cargo.toml)"
          if [ -z "$manifest" ]; then
            echo "::error::Could not parse version from rust/Cargo.toml"
            exit 1
          fi
          if [ "$expected" != "$manifest" ]; then
            echo "::error::Tag version '$expected' does not match rust/Cargo.toml version '$manifest'"
            exit 1
          fi
          echo "Tag version '$expected' matches rust/Cargo.toml version '$manifest'"

  test:
    name: Test gate
    needs: version-guard
    if: always() && !cancelled() && (needs.version-guard.result == 'success' || needs.version-guard.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: rust
        # The differential suite needs the frozen Ruby tree; point SHARKY_REF at
        # a missing oracle so it is skipped, as in the main rust workflow.
        env:
          SHARKY_REF: /nonexistent/sharky
        run: cargo test --locked --jobs 2

  binary:
    name: Static binary
    needs: [version-guard, test]
    if: always() && !cancelled() && (needs.version-guard.result == 'success' || needs.version-guard.result == 'skipped') && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: rust
        run: cargo build --release --locked --jobs 2 --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          install -Dm755 rust/target/x86_64-unknown-linux-musl/release/sharky sharky
          install -Dm644 rust/man/sharky.1 sharky.1
          install -Dm644 rust/examples/config.sharky config.sharky
          install -Dm644 rust/examples/theme.sharky theme.sharky
          tar -czf sharky-x86_64-unknown-linux-musl.tar.gz \
            sharky sharky.1 config.sharky theme.sharky
          sha256sum sharky-x86_64-unknown-linux-musl.tar.gz \
            > sharky-x86_64-unknown-linux-musl.tar.gz.sha256
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sharky-x86_64-unknown-linux-musl.tar.gz
            sharky-x86_64-unknown-linux-musl.tar.gz.sha256
          generate_release_notes: true
