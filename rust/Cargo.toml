[package]
name = "sharky"
version = "3.5.4"
edition = "2024"
rust-version = "1.85"
description = "Unix-first interactive shell"
license = "GPL-3.0-only"
publish = false

[workspace]
members = ["config"]

[dependencies]
nix = { version = "0.31", features = ["process", "signal", "term", "fs"] }
regex-lite = "0.1"
sharky-config = { path = "config" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
